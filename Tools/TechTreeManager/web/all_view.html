<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All YML Preview</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    canvas {
      flex: 1;
      background: #f0f0f0;
      cursor: grab;
    }
    #controls {
      padding: 10px;
      background: #ddd;
    }
  </style>
</head>
<body>
  <div id="controls">
    <input type="file" id="file-input" multiple>
    <button id="export">Download All YML</button>
  </div>
  <canvas id="canvas" width="2000" height="2000"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="all_view.js"></script>
</body>
</html>
