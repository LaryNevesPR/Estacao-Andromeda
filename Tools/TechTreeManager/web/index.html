<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YML Tech Grid Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Tech Tree Editor</h1>
  <input type="file" id="file-input" multiple accept=".yml" />
  <canvas id="grid" width="2000" height="1000"></canvas>

  <div id="editor">
    <h2>Edit Technology</h2>
    <label>ID: <input type="text" id="edit-id" disabled></label>
    <label>Name: <input type="text" id="edit-name"></label>
    <label>Discipline: <input type="text" id="edit-discipline"></label>
    <label>Tier: <input type="number" id="edit-tier"></label>
    <label>Cost: <input type="number" id="edit-cost"></label>
    <label>Position: <input type="text" id="edit-position" disabled></label>

    <button id="save">Save</button>
    <button id="download">Download YAML</button>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
