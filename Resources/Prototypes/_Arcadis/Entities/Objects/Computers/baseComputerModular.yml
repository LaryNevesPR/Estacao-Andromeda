- type: entity
  parent: BaseComputer
  id: BaseComputerModular
  name: Computador Modular
  description: Parte de uma iniciativa recente para tornar os computadores menos estáticos. Vem com um slot de disco para vários "discos de programas".
  components:
  - type: Computer
    board: BaseComputerModularCircuitBoard
  - type: ModularComputer
  - type: ItemSlots
    slots:
      modularComputerDiskSlot:
        name: Disco de Programa
        insertSound:
          path: /Audio/Machines/terminal_insert_disc.ogg
        ejectSound:
          path: /Audio/Machines/terminal_insert_disc.ogg
        whitelist:
          tags:
          - ComputerDisk
  - type: ContainerContainer
    containers:
      board: !type:Container
        showEnts: False
        occludes: True
        ents: []
      modularComputerDiskSlot: !type:ContainerSlot
        showEnts: False
        occludes: True
        ent: null

- type: entity
  parent: BaseComputerCircuitboard
  id: BaseComputerModularCircuitBoard
  name: Placa de Circuito de Computador Modular
  description: Uma placa de circuito impresso de computador para um computador modular.
  components:
  - type: ComputerBoard
    prototype: BaseComputerModular

- type: latheRecipe
  id: BaseComputerModularCircuitBoard
  result: BaseComputerModularCircuitBoard
  category: Circuitry
  completetime: 4
  materials:
    Steel: 100
    Glass: 500
    Gold: 100
