- type: entity
  parent: GasPressurePump
  id: GasPressurePumpHighFlow
  name: bomba de gás de alto fluxo
  description: Uma bomba que move gás por pressão. Bombeia ar a três vezes a pressão de uma bomba padrão.
  placement:
    mode: SnapgridCenter
  components:
  - type: GasPressurePump
    enabled: false
    maxTargetPressure: 13500

- type: entity
  parent: GasVolumePump
  id: GasVolumePumpHighFlow
  name: bomba volumétrica de gás de alto fluxo.
  description: Uma bomba que move gás por volume. Bombeia ar a três vezes o volume de uma bomba padrão.
  placement:
    mode: SnapgridCenter
  components:
  - type: GasVolumePump
    maxTransferRate: 600

- type: entity
  parent: GasDualPortVentPump
  id: GasDualPortVentPumpHighFlow
  name: ventilação de alto fluxo de duas portas
  description: Possui uma válvula e uma bomba anexadas a ela. Existem duas portas, uma é uma entrada para liberar ar, a outra é uma saída ao sifonar. Pode lidar com três vezes a pressão de uma ventilação padrão.
  placement:
    mode: SnapgridCenter
  components:
  - type: GasVentPump
    maxPressure: 13500
    PumpPower: 6
