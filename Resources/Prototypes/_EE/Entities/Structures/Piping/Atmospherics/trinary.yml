- type: entity
  parent: GasFilter
  id: GasFilterHighFlow
  name: filtro de gás de alto fluxo
  description: Muito útil para filtrar gases. Pode lidar com três vezes o volume de um filtro padrão, o que o torna adequado para uso em motores de supermatéria.
  placement:
    mode: SnapgridCenter
  components:
  - type: GasFilter
    enabled: false
    transferRate: 3000
    maxTransferRate: 3000

- type: entity
  parent: GasFilterFlipped
  id: GasFilterFlippedHighFlow
  name: filtro de gás de alto fluxo
  suffix: Invertido
  placement:
    mode: SnapgridCenter
  components:
    - type: GasFilter
      enabled: false
      transferRate: 3000
      maxTransferRate: 3000

- type: entity
  parent: GasMixer
  id: GasMixerHighFlow
  name: misturador de gás de alta pressão
  description: Usado para misturar gases nas pressões extremas exigidas por motores de supermatéria.
  placement:
    mode: SnapgridCenter
  components:
  - type: GasMixer
    maxTargetPressure: 13500

- type: entity
  parent: GasMixerFlipped
  id: GasMixerFlippedHighFlow
  name: misturador de gás de alta pressão
  suffix: Invertido
  placement:
    mode: SnapgridCenter
  components:
    - type: GasMixer
      maxTargetPressure: 13500

- type: entity
  parent: PressureControlledValve
  id: PressureControlledValveHighFlow
  name: válvula de alívio
  description: Uma variante de uma válvula pneumática projetada para supressão de incêndio em motores de supermatéria. Quando a pressão na direção do fluxo excede a pressão "de referência" em seu lado, a válvula abre.
  placement:
    mode: SnapgridCenter
  components:
  - type: PressureControlledValve
    maxTransferRate: 3000
