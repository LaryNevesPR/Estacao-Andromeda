- type: entity
  parent: GasVentPump
  id: GasVentPumpHighFlow
  name: ventilação de ar de alta pressão
  description: Um tubo com uma bomba de alto fluxo acoplada. Pode lidar com três vezes a pressão de uma ventilação padrão.
  placement:
    mode: SnapgridCenter
  components:
  - type: GasVentPump
    maxPressure: 13500
    PumpPower: 6

- type: entity
  parent: GasVentScrubber
  id: GasVentScrubberHighFlow
  name: purificador de ar de alta pressão
  description: Um tubo com um purificador de ar acoplado. Pode lidar com três vezes a pressão de um purificador padrão.
  placement:
    mode: SnapgridCenter
  components:
  - type: GasVentScrubber
    maxPressure: 13500
    maxTransferRate: 600

- type: entity
  parent: GasOutletInjector
  id: GasOutletInjectorHighFlow
  name: injetor de ar de alta pressão
  description: Um injetor de ar projetado para lidar com três vezes a pressão de um injetor padrão.
  placement:
    mode: SnapgridCenter
  components:
  - type: GasOutletInjector
    maxTransferRate: 600
    maxPressure: 13500

