# Para roupas da facção relacionadas à Marinha da Aliança Solar e suas Forças Armadas
# Link de informações de lore
- type: entity
  id: SolAllianceInfo
  abstract: true
  components:
  - type: GuideHelp
    guides: [SolAlliance]

# Uniformes
- type: entity
  parent: [ClothingUniformBase, ClothingUniformFoldableBase, SolAllianceInfo]
  id: ClothingUniformJumpsuitSolFatigueGreen
  name: farda SAN
  suffix: Verde
  description: Um uniforme comum usado pelos "soldados rasos" nas Forças Armadas Solarianas. Embora a Terra já não seja mais o paraíso verde de antigamente, as fardas de combate em verde oliva continuam sendo um emblema dos militares da antiga Terra.
  components:
  - type: Sprite
    sprite: _EE/Clothing/SolAlliance/Uniforms/SAN_fatigue_green.rsi
  - type: Clothing
    sprite: _EE/Clothing/SolAlliance/Uniforms/SAN_fatigue_green.rsi

- type: entity
  parent: [ClothingUniformBase, ClothingUniformFoldableBase, SolAllianceInfo]
  id: ClothingUniformJumpsuitSolFatigueGrey
  name: farda SAN
  suffix: Cinza
  description: Um uniforme comum usado pelos "soldados rasos" nas Forças Armadas Solarianas. Embora não seja tão comum quanto as fardas de combate em verde oliva, o "cinza pedra" continua sendo uma escolha popular de cor de uniforme.
  components:
  - type: Sprite
    sprite: _EE/Clothing/SolAlliance/Uniforms/SAN_fatigue_grey.rsi
  - type: Clothing
    sprite: _EE/Clothing/SolAlliance/Uniforms/SAN_fatigue_grey.rsi

- type: entity
  parent: [ClothingUniformBase, ClothingUniformFoldableBase, SolAllianceInfo]
  id: ClothingUniformJumpsuitSolFatigueIPC
  name: farda SAN IPC
  suffix: Cinza
  description: IPCs são a única exceção à infame xenofobia das Forças Armadas Solarianas. Embora a SAN nunca tenha permitido que um alienígena servisse, ela está ansiosa para usar sintéticos para poupar humanos de trabalhos extenuantes ou de enfrentar situações mortais.
  components:
  - type: Sprite
    sprite: _EE/Clothing/SolAlliance/Uniforms/SAN_fatigue_ipc.rsi
  - type: Clothing
    sprite: _EE/Clothing/SolAlliance/Uniforms/SAN_fatigue_ipc.rsi
