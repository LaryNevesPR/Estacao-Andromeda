# Helmets
- type: entity
  parent: [ClothingHeadHelmetBasic, SolAllianceInfo, BaseClothingRadio]
  id: ClothingHeadHelmetSAN
  name: capacete tático SAN
  description: Um design simples de capacete solariano, apenas marginalmente diferente do antigo sallet que o inspirou. Hoje eles são feitos do mesmo aço dos cascos das naves estelares. Ele incorpora um rádio de onda curta embutido.
  components:
  - type: Sprite
    sprite: _EE/Clothing/SolAlliance/Helmet/SAN_tactical_helmet.rsi
  - type: Clothing
    sprite: _EE/Clothing/SolAlliance/Helmet/SAN_tactical_helmet.rsi
  - type: TelecomExempt
  - type: RadioMicrophone
    broadcastChannel: Handheld
    toggleOnInteract: false
    frequency: 2132
  - type: RadioSpeaker
    toggleOnInteract: false
    channels:
    - Handheld
  - type: Speech
    speechVerb: Robotic
  - type: Tag
    tags:
    - Radio
  - type: ActivatableUI
    key: enum.HandheldRadioUiKey.Key
  - type: UserInterface
    interfaces:
      enum.HandheldRadioUiKey.Key:
        type: HandheldRadioBoundUserInterface
