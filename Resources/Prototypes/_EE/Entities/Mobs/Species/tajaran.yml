- type: entity
  name: Urist McTajaran
  parent: BaseMobSpeciesOrganic
  id: MobTajaranBase
  abstract: true
  components:
  - type: Hunger
    baseDecayRate: 0.02083333332 # 25% mais que o padrão
  - type: Thirst
  - type: Sprite
    scale: 0.8, 0.8
  - type: HumanoidAppearance
    species: Tajaran
  - type: Fixtures
    fixtures: # TODO: isso precisa de uma segunda fixture apenas para colisões de mobs.
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.28
        density: 140
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Body
    prototype: Tajaran
    requiredLegs: 2
  - type: Damageable
    damageModifierSet: Tajaran
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.85  # 0.7 é a velocidade base.
      80: 0.75  # 0.5 é a velocidade base.
  - type: Carriable # Sistema de transporte da nyanotrasen.
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatHuman
      amount: 5
  - type: Flammable
    fireStackIncreaseMultiplier: 1.35 # até que você queime, porque também é oleoso
  - type: NightVision
    color: "#808080"
    activateSound: null
    deactivateSound: null
  - type: Flashable
    eyeDamageChance: 0.3
    eyeDamage: 1
    durationMultiplier: 1.5
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 4
        Piercing: 1
  - type: Speech
    speechSounds: Alto
  - type: DamageOnHighSpeedImpact # Aterrissando nas quatro patas!
    damage:
      types:
        Blunt: 1
  - type: Stamina
    critThreshold: 85
    decay: 2.55 # 3 decaimento base multiplicado por 0.85 = 2.55
  - type: TypingIndicator
    proto: felinid
  - type: PseudoItem
    storedOffset: 0,17
    shape:
      - 0,0,1,4
      - 0,2,3,4
      - 4,0,5,4
  - type: Vocal
    wilhelm: "/Audio/Nyanotrasen/Voice/Felinid/cat_wilhelm.ogg"
    sounds:
      Male: MaleFelinid
      Female: FemaleFelinid
      Unsexed: MaleFelinid
  - type: Felinid # real
  - type: NoShoesSilentFootsteps
  - type: StepTriggerImmune
    whitelist:
      types:
        - Shard
        - Landmine
        - Mousetrap
        - SlipEntity
  - type: LanguageKnowledge
    speaks:
    - TauCetiBasic
    - SiikMaas
    understands:
    - TauCetiBasic
    - SiikMaas
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - FelinidEmotes
  - type: FootPrints
  - type: Temperature
    coldDamageThreshold: 248.15 # -25 graus Celsius, cerca de 12 graus abaixo do normal
    currentTemperature: 311.76  # Temperatura corporal de um gato
    coldDamage:
      types:
        Cold: 0.065 # em linha com a resistência ao frio
    heatDamage:
      types:
        Heat: 2 # pobrezinho
  - type: ThermalRegulator
    normalBodyTemperature: 311.76


- type: entity
  save: false
  name: Urist McHands
  parent: MobHumanDummy
  id: MobTajaranDummy
  categories: [ HideSpawnMenu ]
  description: Um boneco tajaran destinado a ser usado na configuração do personagem.
  components:
  - type: HumanoidAppearance
    species: Tajaran
