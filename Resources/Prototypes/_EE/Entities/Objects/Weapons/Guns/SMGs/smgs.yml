- type: entity
  name: submetralhadora FPA-90
  parent: BaseWeaponPistol
  id: WeaponSubMachineGunFPA90
  description: É uma merda barata feita por uma empresa bem conhecida por fazer armas baratas, mas pelo menos você não precisa de proteção auditiva enquanto a usa. Dispara munição .25 caseless.
  components:
  - type: Sprite
    sprite: _EE/Objects/Weapons/Guns/SMGs/FPA90.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    minAngle: 10
    maxAngle: 15
    fireRate: 20
    burstFireRate: 20
    shotsPerBurst: 3
    burstCooldown: 1.1
    selectedMode: Burst
    soundGunshot:
      path: /Audio/_EE/Weapons/Guns/Gunshots/fpa-90-suppressed-gunshot.ogg
      params:
        volume: -3
        maxDistance: 8
        rolloffFactor: 1.2
    availableModes:
    - Burst
    fireOnDropChance: 1
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineCaselessRifle
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
        tags:
        - MagazineCaselessRifle
      gun_chamber:
        name: Chamber
        startingItem: CartridgeCaselessRifle
        priority: 1
        whitelist:
        tags:
        - CartridgeCaselessRifle
  - type: Appearance
  - type: StaticPrice
    price: 200
  - type: Item
    size: Large
    shape: null
  - type: ExtendDescription
    descriptionList:
      - description: "gun-suppressed"
        fontSize: 10
        color: "#ff4f00"
        requireDetailRange: false

- type: entity
  name: BRDI R-25
  parent: [BaseWeaponSubMachineGun, BaseGunWieldable]
  id: WeaponSubMachineGunBRDIR25
  description: Uma arma icônica usada por membros da Legião Estrangeira da República de Biesel. Como orgulho das colônias, representa a liberdade da tirania da Aliança Solar. É equipada com munição .25 caseless.
  components:
  - type: Sprite
    sprite: _EE/Objects/Weapons/Guns/SMGs/BRDI_R25.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Wieldable
  - type: GunWieldBonus
    minAngle: -19
    maxAngle: -16
  - type: Gun
    minAngle: 21
    maxAngle: 32
    fireRate: 5 # 300rpm em Semi & Automático
    burstFireRate: 20 # 1200rpm em modo Burst.
    shotsPerBurst: 5
    burstCooldown: 0.8
    cameraRecoilScalar: 0.5
    selectedMode: Burst
    soundGunshot:
      path: /Audio/_EE/Weapons/Guns/Gunshots/fpa-90-suppressed-gunshot.ogg
      params:
        volume: -3
        maxDistance: 8
        rolloffFactor: 1.2
    availableModes:
    - SemiAuto
    - Burst
    - FullAuto
    fireOnDropChance: 0.3
  - type: ChamberMagazineAmmoProvider
    autoEject: true
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 1500
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineCaselessRifle
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
        tags:
        - MagazineCaselessRifle
      gun_chamber:
        name: Chamber
        startingItem: CartridgeCaselessRifle
        priority: 1
        whitelist:
        tags:
        - CartridgeCaselessRifle
  - type: ExtendDescription
    descriptionList:
      - description: "gun-suppressed"
        fontSize: 10
        color: "#ff4f00"
        requireDetailRange: false

- type: entity
  name: BRDI R-25 antiga
  parent: WeaponSubMachineGunBRDIR25
  id: WeaponSubMachineGunBRDIR25HoS
  description: Outrora empunhada por um membro desconhecido da Legião Estrangeira de Biesel, este amado rifle viu batalha com Sol em todos os mundos das colônias.
  components:
  - type: StealTarget
    stealGroup: HoSAntiqueWeapon
  - type: Sprite
    sprite: _EE/Objects/Weapons/Guns/SMGs/BRDI_R25_antique.rsi
