- type: entity
  id: PartTajaran
  parent: [BaseItem, BasePart]
  name: "parte do corpo de tajaran"
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: TorsoTajaran
  name: "torso de tajaran"
  parent: [PartTajaran, BaseTorso]
  components:
  - type: Sprite
    sprite: _EE/Mobs/Species/Tajaran/parts.rsi
    state: "torso_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

