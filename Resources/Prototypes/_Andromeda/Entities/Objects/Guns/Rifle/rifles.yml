- type: entity
  name: MA56XF
  parent: BaseWeaponRifle
  id: WeaponRifleMA56XF
  description: An advanced military-grade assault rifle. Uses .20 rifle ammo.
  components:
    - type: Sprite
      sprite: _Andromeda/Objects/Weapons/Guns/Rifle/ma56xf.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-0
         map: ["enum.GunVisualLayers.Mag"]
    - type: Clothing
      sprite: _Andromeda/Objects/Weapons/Guns/Rifle/ma56xf.rsi
    - type: Gun
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/ltrifle.ogg
      fireOnDropChance: 0.2
    - type: ItemSlots
      slots:
        gun_magazine:
          name: Magazine
          startingItem: MagazineRifle
          insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
          ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
          priority: 2
          whitelist:
            tags:
              - MagazineRifle
        gun_chamber:
          name: Chamber
          startingItem: CartridgeRifle
          priority: 1
          whitelist:
            tags:
              - CartridgeRifle
    - type: ContainerContainer
      containers:
        gun_magazine: !type:ContainerSlot
        gun_chamber: !type:ContainerSlot
    - type: MagazineVisuals
      magState: mag
      steps: 1
      zeroVisible: true
    - type: Appearance
